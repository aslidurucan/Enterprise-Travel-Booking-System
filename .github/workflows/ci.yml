name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore dependencies
        run: dotnet restore EnterpriseTravelBooking.sln

      - name: Build
        run: dotnet build EnterpriseTravelBooking.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EnterpriseTravelBooking.sln --no-build --configuration Release --verbosity normal
