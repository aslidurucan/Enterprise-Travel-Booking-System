name: Docker Build

on:
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        

      - name: Build Identity.API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Identity.API/Dockerfile
          push: false
          tags: wandersync/identity-api:latest

      - name: Build Catalog.API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Catalog.API/Dockerfile
          push: false
          tags: wandersync/catalog-api:latest

      - name: Build Rentals.API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Rentals.API/Dockerfile
          push: false
          tags: wandersync/rentals-api:latest

      - name: Build Notification.Service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Notification.Service/Dockerfile
          push: false
          tags: wandersync/notification-service:latest

      - name: Build ApiGateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ApiGateway/Dockerfile
          push: false
          tags: wandersync/api-gateway:latest
